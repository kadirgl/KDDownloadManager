<!doctype html>
<!-- Chrome Web Mağazası tanıtım görselleri: ?size=small (440×280) | marquee (1400×560), ?lang=tr|en. -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff;
      background: radial-gradient(120% 140% at 0% 0%, #4A3366 0%, #261D3A 55%, #15111F 100%);
      display: flex; align-items: center; }
    .icon { flex: none; filter: drop-shadow(0 16px 30px rgba(240, 138, 46, .35)); }
    h1 { margin: 0; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
    p { margin: 0; opacity: .94; font-weight: 500; line-height: 1.35; }
    body.small { width: 440px; height: 280px; padding: 0 34px; box-sizing: border-box; gap: 24px; }
    body.small .icon { width: 108px; height: 108px; }
    body.small h1 { font-size: 30px; margin-bottom: 10px; }
    body.small p { font-size: 15px; }
    body.marquee { width: 1400px; height: 560px; padding: 0 120px; box-sizing: border-box; gap: 64px; }
    body.marquee .icon { width: 240px; height: 240px; }
    body.marquee h1 { font-size: 72px; margin-bottom: 20px; }
    body.marquee p { font-size: 30px; max-width: 760px; }
  </style>
</head>
<body>
  <img class="icon" src="/assets/icon512.png" alt="">
  <div><h1>KD Download<br>Manager</h1><p id="tagline"></p></div>
  <script>
    const params = new URLSearchParams(location.search);
    document.body.className = params.get("size") === "marquee" ? "marquee" : "small";
    document.getElementById("tagline").textContent = params.get("lang") === "tr"
      ? "İndirmeleri ve videoları tek tıkla uygulamaya gönder."
      : "Send downloads and videos to the app in one click.";
  </script>
</body>
</html>
